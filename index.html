<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="The official app catalogue for AuraOS. Browse apps, agents and capabilities, then install them into your own self-hosted OS with one command.">
<meta name="color-scheme" content="dark">

<meta property="og:type" content="website">
<meta property="og:title" content="AuraOS Store — the official app catalogue">
<meta property="og:description" content="Browse apps, agents and capabilities for AuraOS, then install them into your own self-hosted OS with one command.">
<meta name="twitter:card" content="summary_large_image">

<title>AuraOS Store — the official app catalogue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Orbitron:wght@600;700;800&family=Share+Tech+Mono&display=swap">
<style>
  /* scificn HUD · AuraOS "CYAN" theme — the same token set as the AuraOS
     landing page, so the store reads as one product with it. Deliberate single
     dark world; every colour comes from a token and the body ground is
     explicit, so the page holds regardless of the host theme.

     This is a CATALOGUE, not a landing page: the type scale is one step down
     throughout, the hero is a single line, and the space goes to the grid. */
  :root {
    --bg:#04080a; --surface:#0a1014; --surface-2:#0e1820;
    --primary:#00aaff; --secondary:#88ddff; --human:#ffd166; --danger:#ff5c5c;
    --text:#ccecff; --dim:#557788; --faint:#34505e;
    --border:rgba(0,170,255,.20); --border-2:rgba(0,170,255,.42);
    --glow:0 0 4px #00aaff, 0 0 10px rgba(0,170,255,.22);
    --glow-human:0 0 5px #ffd166, 0 0 12px rgba(255,209,102,.22);
    --clip:polygon(11px 0,100% 0,100% calc(100% - 11px),calc(100% - 11px) 100%,0 100%,0 11px);
    --clip-sm:polygon(4px 0,100% 0,100% calc(100% - 4px),calc(100% - 4px) 100%,0 100%,0 4px);
    --mono:"Share Tech Mono",ui-monospace,monospace;
    --aura-font-mono:"Courier New","Courier",monospace;
    --aura-glow-primary:0 0 4px #00aaff, 0 0 8px rgba(0,170,255,.18);
    --disp:"Orbitron",ui-sans-serif,sans-serif;
    --body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
    --maxw:1180px;
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body {
    margin:0;
    background:
      radial-gradient(1100px 520px at 84% -14%, rgba(0,170,255,.09), transparent 58%),
      var(--bg);
    color:var(--text); font-family:var(--body); font-size:15px; line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  body::after {
    content:""; position:fixed; inset:0; pointer-events:none; z-index:9;
    background:repeating-linear-gradient(to bottom, rgba(0,170,255,.022) 0 1px, transparent 1px 3px);
    mix-blend-mode:screen;
  }
  .wrap { max-width:var(--maxw); margin:0 auto; padding:0 24px; }
  a { color:var(--primary); }
  h1,h2,h3 { margin:0; }
  p { margin:0; }
  @media (prefers-reduced-motion:reduce) { * { transition:none !important; animation:none !important; } }

  /* ── status bar — mirrors the AuraOS shell's own (StatusBar.astro) ── */
  .statusbar { position:sticky; top:0; z-index:20; border-bottom:1px solid var(--border);
    background:var(--surface); backdrop-filter:blur(6px);
    font-family:var(--aura-font-mono); font-size:.75rem; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); }
  .statusbar .in { max-width:var(--maxw); margin:0 auto; height:28px; padding:0 24px; display:flex; justify-content:space-between; align-items:center; gap:12px; }
  .bar-left { display:flex; align-items:center; gap:10px; min-width:0; }
  /* The shell wordmark, verbatim: AURA in primary + glow, OS dimmed. */
  .os-name { color:var(--primary); font-weight:bold; text-shadow:var(--aura-glow-primary);
    white-space:nowrap; user-select:none; flex-shrink:0; text-decoration:none; }
  .os-ver { color:var(--dim); }
  .bar-tag { color:var(--secondary); white-space:nowrap; }
  .led { color:var(--primary); text-shadow:var(--glow); }
  .chip { border:1px solid rgba(255,209,102,.4); color:var(--human); padding:2px 8px; font-size:.6rem;
    letter-spacing:.16em; text-decoration:none; white-space:nowrap;
    transition:border-color .18s ease, box-shadow .18s ease; }
  a.chip:hover { border-color:var(--human); box-shadow:0 0 10px rgba(255,209,102,.28); }
  a.chip:focus-visible { outline:2px solid var(--human); outline-offset:3px; }
  .chip.os { border-color:var(--border-2); color:var(--primary); text-shadow:var(--glow); }
  a.chip.os:hover { border-color:var(--primary); box-shadow:0 0 12px rgba(0,170,255,.34); }
  a.chip.os:focus-visible { outline-color:var(--primary); }
  .bar-right { display:flex; align-items:center; gap:10px; }
  /* U+00B7 middle dot, centred on the row rather than sitting on the baseline */
  .sep { color:var(--primary); text-shadow:var(--glow); user-select:none;
    display:inline-flex; align-items:center; line-height:1; font-size:1.7em; }
  .bar-link { color:var(--dim); text-decoration:none; letter-spacing:.08em;
    transition:color .18s ease, text-shadow .18s ease; }
  .bar-link:hover { color:var(--primary); text-shadow:var(--aura-glow-primary); }
  .bar-link:focus-visible { outline:2px solid var(--primary); outline-offset:3px; }
  .icon-btn { display:inline-flex; align-items:center; justify-content:center; color:var(--human);
    transition:filter .18s ease, transform .18s ease; }
  .icon-btn svg { display:block; }
  .icon-btn:hover { filter:drop-shadow(0 0 6px rgba(255,209,102,.65)); transform:translateY(-1px); }
  .icon-btn:focus-visible { outline:2px solid var(--human); outline-offset:3px; }

  /* ── app toolbar: the store's own navigation + search ── */
  .appbar { position:sticky; top:28px; z-index:15; border-bottom:1px solid var(--border);
    background:rgba(10,16,20,.92); backdrop-filter:blur(8px); }
  .appbar .in { max-width:var(--maxw); margin:0 auto; padding:12px 24px;
    display:flex; align-items:center; gap:18px; flex-wrap:wrap; }
  .brand { display:flex; align-items:baseline; gap:9px; text-decoration:none; flex:none; }
  .brand .mark { font-family:var(--disp); font-weight:700; font-size:1rem; letter-spacing:.08em;
    color:var(--text); text-transform:uppercase; }
  .brand .mark b { color:var(--primary); text-shadow:var(--glow); font-weight:700; }
  .brand .sub { font-family:var(--mono); font-size:.68rem; letter-spacing:.28em; text-transform:uppercase;
    color:var(--primary); text-shadow:var(--glow); }
  .nav { display:flex; gap:4px; flex:none; }
  .nav a { font-family:var(--mono); font-size:.74rem; letter-spacing:.14em; text-transform:uppercase;
    text-decoration:none; color:var(--dim); padding:7px 13px; clip-path:var(--clip-sm);
    border:1px solid transparent; transition:color .18s ease, border-color .18s ease, background .18s ease; }
  .nav a:hover { color:var(--secondary); border-color:var(--border); }
  .nav a:focus-visible { outline:2px solid var(--primary); outline-offset:2px; }
  .nav a[aria-current="page"] { color:var(--primary); text-shadow:var(--glow);
    border-color:var(--primary); background:rgba(0,170,255,.1); }

  .search { flex:1 1 220px; min-width:0; max-width:400px; margin-left:auto; position:relative; display:flex; align-items:center; }
  .search::before { content:"⌕"; position:absolute; left:12px; color:var(--primary); text-shadow:var(--glow); font-size:1rem; pointer-events:none; }
  .search input { width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text);
    font-family:var(--mono); font-size:.84rem; letter-spacing:.03em; padding:8px 12px 8px 31px; clip-path:var(--clip-sm);
    transition:border-color .18s ease, box-shadow .18s ease; }
  .search input::placeholder { color:var(--faint); }
  .search input:focus { outline:none; border-color:var(--border-2); box-shadow:0 0 16px rgba(0,170,255,.14); }
  /* Needed explicitly: the UA's [hidden] rule is display:none, which .search's
     own display:flex would otherwise win against. */
  .search[hidden] { display:none; }

  /* Must be `main.wrap`, not `main`: this element carries .wrap too, and a
     class selector outranks an element one - a bare `main { padding }` rule is
     silently overridden by .wrap's own padding and does nothing at all.
     The bottom value is the gap between the last card and the footer rule;
     a dense grid needs more of it than a column of prose does. */
  main.wrap { padding-top:34px; padding-bottom:84px; }

  /* ── catalogue: rail + grid ── */
  .catalogue { display:grid; grid-template-columns:196px 1fr; gap:30px; align-items:start; padding-top:16px; }
  .rail { position:sticky; top:88px; display:flex; flex-direction:column; gap:3px; }
  .rail-h { font-family:var(--mono); font-size:.66rem; letter-spacing:.2em; text-transform:uppercase;
    color:var(--faint); padding:6px 10px 9px; }
  .rail-i { display:flex; justify-content:space-between; align-items:center; gap:10px; width:100%;
    font-family:var(--mono); font-size:.76rem; letter-spacing:.1em; text-transform:uppercase; text-align:left;
    cursor:pointer; background:none; border:1px solid transparent; color:var(--dim); padding:7px 10px;
    clip-path:var(--clip-sm); transition:color .18s ease, background .18s ease, border-color .18s ease; }
  .rail-i:hover { color:var(--secondary); background:var(--surface); }
  .rail-i:focus-visible { outline:2px solid var(--primary); outline-offset:2px; }
  .rail-i[aria-pressed="true"] { color:var(--primary); text-shadow:var(--glow);
    background:rgba(0,170,255,.1); border-color:var(--border-2); }
  .rail-i .n { font-size:.7rem; color:var(--faint); }
  .rail-i[aria-pressed="true"] .n { color:var(--primary); }

  .content-h { display:flex; align-items:baseline; justify-content:space-between; gap:14px;
    flex-wrap:wrap; margin-bottom:16px; }
  .content-h h1 { font-family:var(--disp); font-weight:600; font-size:1.02rem; letter-spacing:.06em; text-transform:uppercase; }
  .count { font-family:var(--mono); font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); white-space:nowrap; }

  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(272px, 1fr)); gap:14px; }

  /* ── app card — compact, scannable, whole tile is the link ── */
  .card { position:relative; display:flex; flex-direction:column; gap:10px;
    background:var(--surface); border:1px solid var(--border); clip-path:var(--clip); padding:16px 17px;
    transition:border-color .18s ease, box-shadow .18s ease, transform .18s ease; }
  .card:hover { border-color:var(--border-2); box-shadow:0 0 24px rgba(0,170,255,.12); transform:translateY(-2px); }
  .card:focus-within { border-color:var(--primary); box-shadow:0 0 24px rgba(0,170,255,.2); }
  .card-top { display:flex; align-items:flex-start; gap:11px; }
  /* The glyph badge, matching how the Nexus app renders the same field. */
  .glyph { flex:none; display:inline-flex; align-items:center; justify-content:center;
    min-width:34px; height:30px; padding:0 7px;
    font-family:var(--mono); font-size:.8rem; letter-spacing:.06em;
    color:var(--primary); text-shadow:var(--glow);
    border:1px solid var(--border-2); background:rgba(0,170,255,.1); clip-path:var(--clip-sm); }
  .card-name { font-family:var(--disp); font-weight:600; font-size:.9rem; letter-spacing:.02em; color:var(--text); }
  /* Stretched link: the tile is clickable without nesting the copy button
     inside an <a>, which would be invalid and would swallow its click. */
  .card-name a { color:inherit; text-decoration:none; }
  .card-name a::after { content:""; position:absolute; inset:0; }
  .card-name a:focus-visible { outline:none; }
  .card-id { margin-top:2px; font-family:var(--mono); font-size:.7rem; letter-spacing:.03em; color:var(--dim); word-break:break-all; }
  .card-desc { font-size:.82rem; line-height:1.5; color:var(--dim);
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .card-foot { margin-top:auto; padding-top:11px; border-top:1px solid var(--border);
    display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .badge { font-family:var(--mono); font-size:.66rem; letter-spacing:.08em; text-transform:uppercase;
    color:var(--secondary); border:1px solid var(--border); padding:3px 7px; clip-path:var(--clip-sm); white-space:nowrap; }
  .badge.src { color:var(--primary); border-color:var(--border-2); }
  .badge.feat { color:var(--human); border-color:rgba(255,209,102,.4); }
  /* Sits above the stretched link so its own click is not swallowed. */
  .copy-mini { position:relative; z-index:1; margin-left:auto; flex:none; cursor:pointer;
    font-family:var(--mono); font-size:.66rem; letter-spacing:.12em; text-transform:uppercase;
    background:none; border:1px solid var(--border); color:var(--dim); padding:4px 9px; clip-path:var(--clip-sm);
    transition:color .18s ease, border-color .18s ease, background .18s ease; }
  .copy-mini:hover { color:var(--primary); border-color:var(--border-2); background:rgba(0,170,255,.1); text-shadow:var(--glow); }
  .copy-mini:focus-visible { outline:2px solid var(--primary); outline-offset:2px; }

  /* ── detail page ── */
  /* A real button, not a text link: leaving a detail page is the most common
     thing a reader does here, so it gets a target worth aiming at. */
  .back { display:inline-flex; align-items:center; gap:10px; margin-bottom:24px;
    font-family:var(--mono); font-size:.82rem; letter-spacing:.13em; text-transform:uppercase;
    color:var(--secondary); text-decoration:none;
    padding:11px 20px; background:var(--surface); border:1px solid var(--border); clip-path:var(--clip-sm);
    transition:color .18s ease, border-color .18s ease, background .18s ease, box-shadow .18s ease; }
  .back .arrow { font-size:1rem; line-height:1; color:var(--primary); text-shadow:var(--glow);
    transition:transform .18s ease; }
  .back:hover { color:var(--text); border-color:var(--border-2); background:var(--surface-2);
    box-shadow:0 0 18px rgba(0,170,255,.14); }
  .back:hover .arrow { transform:translateX(-3px); }
  .back:focus-visible { outline:2px solid var(--primary); outline-offset:3px; }
  .detail { display:flex; flex-direction:column; gap:22px; max-width:860px; }
  .back { margin-top:6px; }
  .dt-head { display:flex; align-items:flex-start; gap:16px; }
  .glyph.lg { min-width:54px; height:48px; font-size:1.15rem; }
  .dt-head h1 { font-family:var(--disp); font-weight:700; font-size:1.5rem; letter-spacing:.03em; color:var(--text); }
  .dt-id { margin-top:5px; font-family:var(--mono); font-size:.8rem; color:var(--dim); word-break:break-all; }
  .dt-badges { margin-top:11px; display:flex; gap:6px; flex-wrap:wrap; }
  .dt-desc { font-size:.98rem; line-height:1.65; color:var(--text); max-width:64ch; }

  .panel { position:relative; background:var(--surface); border:1px solid var(--border); clip-path:var(--clip); }
  .brackets::before,.brackets::after { content:""; position:absolute; width:13px; height:13px; pointer-events:none; }
  .brackets::before { top:6px; right:6px; border-top:1px solid var(--border-2); border-right:1px solid var(--border-2); }
  .brackets::after { bottom:6px; left:6px; border-bottom:1px solid var(--border-2); border-left:1px solid var(--border-2); }

  .term-bar { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:8px 15px;
    border-bottom:1px solid var(--border); font-family:var(--mono); font-size:.62rem; letter-spacing:.18em;
    text-transform:uppercase; color:var(--dim); }
  .term-body { padding:18px 20px; overflow-x:auto; }
  .term-body pre { margin:0; font-family:var(--mono); font-size:.9rem; line-height:1.95; color:var(--text); }
  .term-body .ps1 { color:var(--primary); text-shadow:var(--glow); user-select:none; }
  .term-body .cm { color:var(--faint); }
  .copy { font-family:var(--mono); font-size:.62rem; letter-spacing:.14em; text-transform:uppercase; cursor:pointer;
    background:none; border:1px solid var(--border); color:var(--dim); padding:4px 10px;
    transition:color .18s ease, border-color .18s ease; }
  .copy:hover { color:var(--primary); border-color:var(--border-2); text-shadow:var(--glow); }
  .copy:focus-visible { outline:2px solid var(--primary); outline-offset:2px; }

  /* spec table — the facts a reader came for, in one scan */
  .spec { padding:4px 20px; }
  .spec dl { margin:0; display:grid; grid-template-columns:132px 1fr; }
  .spec dt, .spec dd { margin:0; padding:11px 0; border-top:1px solid var(--border);
    font-family:var(--mono); font-size:.78rem; letter-spacing:.03em; }
  .spec dt { color:var(--faint); letter-spacing:.12em; text-transform:uppercase; font-size:.68rem; padding-top:13px; }
  .spec dd { color:var(--secondary); word-break:break-all; display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .spec dl > dt:first-of-type, .spec dl > dt:first-of-type + dd { border-top:none; }
  .spec dd a { color:var(--primary); text-decoration:none; border-bottom:1px solid var(--border-2); }

  /* Sits under the install block on a detail page: quiet until the command
     above it prompts the question it answers. */
  .get-os { margin-top:-8px; font-size:.86rem; color:var(--dim); }
  .get-os a { color:var(--primary); text-decoration:none; border-bottom:1px solid var(--border-2); }
  .get-os a:hover { text-shadow:var(--glow); }

  /* ── screenshots ─────────────────────────────────────────────────────
     A set of pictures is the main thing a person judges an app on, so the
     strip is a way IN to each image rather than the whole presentation:
     thumbnails scroll, clicking one opens it full size. */
  .shots { display:flex; gap:12px; overflow-x:auto; padding-bottom:8px;
    scrollbar-width:thin; scrollbar-color:var(--border-2) transparent; }
  .shots::-webkit-scrollbar { height:6px; }
  .shots::-webkit-scrollbar-thumb { background:var(--border-2); }
  .shot-btn { flex:none; padding:0; border:1px solid var(--border-2); background:var(--surface);
    clip-path:var(--clip); cursor:zoom-in; line-height:0; position:relative;
    transition:border-color .18s ease, box-shadow .18s ease, transform .18s ease; }
  .shot-btn:hover { border-color:var(--primary); box-shadow:0 0 20px rgba(0,170,255,.18); transform:translateY(-2px); }
  .shot-btn:focus-visible { outline:2px solid var(--primary); outline-offset:3px; }
  .shot-btn img { height:200px; width:auto; display:block; }
  .shots-count { font-family:var(--mono); font-size:.7rem; letter-spacing:.14em; text-transform:uppercase;
    color:var(--faint); margin-bottom:9px; }

  /* Lightbox. Fixed overlay above the scanline layer (z-index 9). */
  .lb { position:fixed; inset:0; z-index:60; display:flex; flex-direction:column;
    background:rgba(4,8,10,.94); backdrop-filter:blur(4px); }
  .lb[hidden] { display:none; }
  .lb-bar { display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:12px 20px; border-bottom:1px solid var(--border);
    font-family:var(--mono); font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); }
  .lb-stage { flex:1; min-height:0; display:flex; align-items:center; justify-content:center;
    gap:14px; padding:18px 20px; }
  .lb-stage img { max-width:100%; max-height:100%; object-fit:contain;
    border:1px solid var(--border-2); clip-path:var(--clip); background:var(--surface); }
  .lb-nav { flex:none; font-family:var(--mono); font-size:1.4rem; line-height:1; cursor:pointer;
    background:var(--surface); border:1px solid var(--border); color:var(--secondary);
    padding:14px 16px; clip-path:var(--clip-sm);
    transition:color .18s ease, border-color .18s ease, background .18s ease; }
  .lb-nav:hover { color:var(--primary); border-color:var(--border-2); background:var(--surface-2); text-shadow:var(--glow); }
  .lb-nav:focus-visible { outline:2px solid var(--primary); outline-offset:2px; }
  .lb-nav[hidden] { display:none; }
  .lb-close { font-family:var(--mono); font-size:.72rem; letter-spacing:.14em; text-transform:uppercase;
    cursor:pointer; background:none; border:1px solid var(--border); color:var(--dim); padding:5px 11px;
    clip-path:var(--clip-sm); }
  .lb-close:hover { color:var(--primary); border-color:var(--border-2); text-shadow:var(--glow); }
  .lb-close:focus-visible { outline:2px solid var(--primary); outline-offset:2px; }
  @media (max-width:640px) { .lb-stage { padding:10px; gap:6px; } .lb-nav { padding:10px 11px; font-size:1.1rem; } }

  /* ── section pages (connect / publish) ── */
  .page { max-width:860px; display:flex; flex-direction:column; gap:18px; padding-top:16px; }
  /* Eyebrow and title are one unit, so they sit close together and the page's
     own gap opens up below them rather than between them. */
  .page-head { display:flex; flex-direction:column; gap:7px; }
  .page h1 { font-family:var(--disp); font-weight:700; font-size:1.3rem; letter-spacing:.04em; text-transform:uppercase; }
  .page .tag { font-family:var(--mono); font-size:.7rem; letter-spacing:.2em; text-transform:uppercase; color:var(--primary); text-shadow:var(--glow); }
  .page p { font-size:.92rem; color:var(--dim); max-width:66ch; }
  .page p b { color:var(--text); font-weight:600; }
  .page code { font-family:var(--mono); color:var(--secondary); font-size:.9em; }
  .page a { text-decoration:none; border-bottom:1px solid var(--border-2); }
  .lanes { display:grid; grid-template-columns:repeat(3,1fr); gap:13px; }
  .lane { padding:19px 19px; }
  .lane h3 { font-family:var(--disp); font-weight:600; font-size:.86rem; letter-spacing:.02em; text-transform:uppercase; color:var(--secondary); margin-bottom:9px; }
  .lane p { font-size:.84rem; line-height:1.5; }
  .lane .cmd { margin-top:11px; padding-top:11px; border-top:1px solid var(--border);
    font-family:var(--mono); font-size:.72rem; color:var(--dim); word-break:break-word; }
  .note { font-family:var(--mono); font-size:.86rem; line-height:1.6; letter-spacing:.03em; color:var(--human); opacity:.94; }
  .note::before { content:"⚠ "; }
  .note a { color:var(--human); border-bottom-color:rgba(255,209,102,.4); }

  /* ── states: loading / empty / no-match / error / unknown route ── */
  .state { padding:40px 30px; text-align:center; grid-column:1/-1; }
  .st-mark { font-family:var(--mono); font-size:.68rem; letter-spacing:.22em; text-transform:uppercase; color:var(--primary); text-shadow:var(--glow); }
  .state.err .st-mark { color:var(--danger); text-shadow:0 0 8px rgba(255,92,92,.4); }
  .state h3 { margin-top:12px; font-family:var(--disp); font-weight:600; font-size:.98rem; letter-spacing:.03em; text-transform:uppercase; color:var(--text); }
  .state p { margin:11px auto 0; color:var(--dim); font-size:.88rem; max-width:54ch; }
  .state code { font-family:var(--mono); color:var(--secondary); }
  .state .acts { display:flex; gap:11px; flex-wrap:wrap; justify-content:center; margin-top:20px; }
  .btn { font-family:var(--mono); font-size:.74rem; letter-spacing:.11em; text-transform:uppercase; text-decoration:none;
    padding:11px 21px; clip-path:var(--clip-sm); border:1px solid var(--border-2); color:var(--secondary);
    background:var(--surface); display:inline-flex; align-items:center; gap:8px; cursor:pointer;
    transition:box-shadow .18s ease, background .18s ease, color .18s ease; }
  .btn:hover { color:var(--text); background:var(--surface-2); box-shadow:0 0 18px rgba(0,170,255,.16); }
  .btn:focus-visible { outline:2px solid var(--primary); outline-offset:3px; }
  .btn.primary { background:rgba(0,170,255,.14); border-color:var(--primary); color:var(--primary); text-shadow:var(--glow); }
  .btn.primary:hover { background:rgba(0,170,255,.22); color:var(--text); }

  footer { padding:34px 0 52px; border-top:1px solid var(--border); display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; align-items:center; }
  .foot { display:flex; align-items:center; gap:11px; font-family:var(--mono); font-size:.7rem; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); }
  .foot-links { display:flex; gap:11px; align-items:center; font-family:var(--mono); font-size:.7rem; letter-spacing:.14em; text-transform:uppercase; }
  .foot-links a { color:var(--dim); text-decoration:none; }
  .foot-links a:hover { color:var(--primary); text-shadow:var(--glow); }

  @media (max-width:900px) {
    .catalogue { grid-template-columns:1fr; gap:20px; }
    /* The rail becomes a horizontal chip row above the grid. */
    .rail { position:static; flex-direction:row; flex-wrap:wrap; gap:6px; }
    .rail-h { display:none; }
    .rail-i { width:auto; border-color:var(--border); background:var(--surface); }
    .lanes { grid-template-columns:1fr; }
  }
  @media (max-width:640px) {
    .appbar .in { gap:11px; }
    .search { margin-left:0; max-width:none; order:3; flex-basis:100%; }
    .statusbar .in .hide { display:none; }
    .spec dl { grid-template-columns:1fr; }
    .spec dt { padding-bottom:0; border-top:1px solid var(--border); }
    .spec dd { padding-top:4px; border-top:none; }
    .dt-head h1 { font-size:1.25rem; }
  }
</style>
</head>

<script>
/* The catalogue renders from index.json — the JSON twin of index.yaml, emitted
   by scripts/build-index.mjs. Fetching the JSON keeps this page a static file
   with no build step and no client-side YAML parser, while AuraOS itself keeps
   reading index.yaml.

   Routing is hash-based so the whole store stays one static file that any
   plain file host can serve: #/ , #/app/<id> , #/connect , #/publish .

   Entry text is author-supplied, so every value goes in via textContent and
   every URL is checked to be https: before it becomes an href or a src. */
(function () {
  "use strict";

  var viewEl = document.getElementById("view");
  var navEl  = document.getElementById("nav");
  var qEl    = document.getElementById("q");
  var searchEl = document.querySelector(".search");

  var apps = [], featured = [], categories = [], loadError = null;
  var activeCat = "", query = "";

  var REPO = "https://github.com/lacky95/auraos-store";
  var REGISTRY_CMD = "aura nexus registry add official \\\n    https://nexus.aura.lakner.io/index.yaml \\\n    --kind git-index --priority 10";

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function frag() { return document.createDocumentFragment(); }

  /* Only https URLs become hrefs/srcs. The schema already enforces this at
     review time; enforcing it again here means a bad entry can never turn into
     a javascript: or data: link on our own origin. */
  function safeUrl(u) {
    if (typeof u !== "string") return null;
    try { return new URL(u).protocol === "https:" ? u : null; } catch (e) { return null; }
  }
  function extLink(href, label, cls) {
    var a = el("a", cls || null, label);
    a.href = href; a.target = "_blank"; a.rel = "noopener noreferrer";
    return a;
  }

  /* `icon` is a 1-3 character glyph, not an image URL: it comes straight from
     the app's manifest (capped at 3 chars there) and AuraOS renders it as a
     text badge. Same first-letter fallback the Nexus detail page uses. */
  function glyphOf(e) {
    var g = typeof e.icon === "string" ? e.icon.trim().slice(0, 3) : "";
    return g || String(e.name || e.id).charAt(0).toUpperCase();
  }
  function sourceOf(e) {
    var s = e.sources || {};
    if (s.oci && s.oci.ref) return { kind: "oci", ref: s.oci.ref };
    if (s.git && s.git.ref) return { kind: "git", ref: s.git.ref, branch: s.git["default-branch"] };
    return null;
  }
  function channelsOf(e) {
    var ch = e.channels || {};
    return Object.keys(ch).map(function (name) {
      var c = ch[name] || {};
      return { name: name, tag: c["git-tag"] || c["oci-tag"] || null };
    });
  }
  function primaryChannel(e) {
    var list = channelsOf(e);
    if (!list.length) return null;
    var stable = list.filter(function (c) { return c.name === "stable"; })[0];
    return stable || list[0];
  }
  function installCmd(id) { return "aura nexus app install " + id; }
  function byId(id) { return apps.filter(function (a) { return a.id === id; })[0] || null; }

  function copy(text, btn, restore) {
    var done = function (okd) {
      btn.textContent = okd ? "Copied" : "Ctrl+C";
      setTimeout(function () { btn.textContent = restore; }, 1600);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(false); });
    } else { done(false); }
  }
  function copyBtn(text, cls, label) {
    var b = el("button", cls, label || "Copy");
    b.type = "button";
    b.addEventListener("click", function (ev) { ev.preventDefault(); ev.stopPropagation(); copy(text, b, label || "Copy"); });
    return b;
  }

  function state(cls, mark, heading, paras, links) {
    var root = el("div", "panel brackets state" + (cls ? " " + cls : ""));
    root.appendChild(el("div", "st-mark", mark));
    root.appendChild(el("h3", null, heading));
    paras.forEach(function (p) { root.appendChild(el("p", null, p)); });
    if (links && links.length) {
      var acts = el("div", "acts");
      links.forEach(function (l) {
        var a = el("a", "btn" + (l.primary ? " primary" : ""), l.label);
        a.href = l.href;
        if (l.href.charAt(0) !== "#" && l.href.charAt(0) !== ".") { a.target = "_blank"; a.rel = "noopener"; }
        acts.appendChild(a);
      });
      root.appendChild(acts);
    }
    return root;
  }

  /* ── lightbox ──────────────────────────────────────────────────────────
     One overlay reused for every gallery, built once and kept hidden. Built
     lazily rather than in the markup so a page with no screenshots — which is
     every page today — ships nothing for it.

     Keyboard is not a nicety here: a gallery you can only drive with a mouse
     is one most people cannot compare shots in. Escape closes, arrows move,
     and focus returns to the thumbnail that opened it so the tab order does
     not collapse to the top of the document. */
  var lb = null;

  function ensureLightbox() {
    if (lb) return lb;
    var root = el("div", "lb");
    root.hidden = true;
    root.setAttribute("role", "dialog");
    root.setAttribute("aria-modal", "true");
    root.setAttribute("aria-label", "Screenshot viewer");

    var bar = el("div", "lb-bar");
    var caption = el("span", null, "");
    var close = el("button", "lb-close", "Close ✕");
    close.type = "button";
    bar.appendChild(caption);
    bar.appendChild(close);

    var stage = el("div", "lb-stage");
    var prev = el("button", "lb-nav", "‹");
    var next = el("button", "lb-nav", "›");
    prev.type = "button"; next.type = "button";
    prev.setAttribute("aria-label", "Previous screenshot");
    next.setAttribute("aria-label", "Next screenshot");
    var img = el("img");
    stage.appendChild(prev); stage.appendChild(img); stage.appendChild(next);

    root.appendChild(bar); root.appendChild(stage);
    document.body.appendChild(root);

    lb = { root: root, img: img, caption: caption, prev: prev, next: next,
           urls: [], i: 0, name: "", opener: null };

    var show = function (i) {
      if (!lb.urls.length) return closeLb();
      lb.i = (i + lb.urls.length) % lb.urls.length;   // wrap both ways
      lb.img.src = lb.urls[lb.i];
      lb.img.alt = lb.name + " screenshot " + (lb.i + 1);
      lb.caption.textContent = lb.name + " — " + (lb.i + 1) + " / " + lb.urls.length;
      var many = lb.urls.length > 1;
      lb.prev.hidden = !many;
      lb.next.hidden = !many;
    };
    lb.show = show;

    prev.addEventListener("click", function () { show(lb.i - 1); });
    next.addEventListener("click", function () { show(lb.i + 1); });
    close.addEventListener("click", closeLb);
    // Clicking the backdrop closes; clicking the image or a control does not.
    root.addEventListener("click", function (ev) {
      if (ev.target === root || ev.target === stage) closeLb();
    });
    document.addEventListener("keydown", function (ev) {
      if (!lb || lb.root.hidden) return;
      if (ev.key === "Escape")     { ev.preventDefault(); closeLb(); }
      if (ev.key === "ArrowLeft")  { ev.preventDefault(); show(lb.i - 1); }
      if (ev.key === "ArrowRight") { ev.preventDefault(); show(lb.i + 1); }
    });
    return lb;
  }

  function openLightbox(urls, index, name) {
    if (!urls || !urls.length) return;
    var v = ensureLightbox();
    v.urls = urls.slice();
    v.name = name || "";
    v.opener = document.activeElement;
    v.root.hidden = false;
    v.show(index < 0 ? 0 : index);
    v.next.hidden ? v.root.querySelector(".lb-close").focus() : v.next.focus();
  }

  function closeLb() {
    if (!lb || lb.root.hidden) return;
    lb.root.hidden = true;
    lb.img.removeAttribute("src");
    // Put focus back where it came from, not at the top of the page.
    if (lb.opener && lb.opener.focus) lb.opener.focus();
    lb.opener = null;
  }

  /* ── card ───────────────────────────────────────────────────────────── */
  function card(e) {
    var root = el("div", "card");
    var top = el("div", "card-top");
    top.appendChild(el("span", "glyph", glyphOf(e)));

    var idcol = el("div");
    var name = el("div", "card-name");
    var link = el("a", null, e.name || e.id);
    link.href = "#/app/" + encodeURIComponent(e.id);
    name.appendChild(link);
    idcol.appendChild(name);
    idcol.appendChild(el("div", "card-id", e.id));
    top.appendChild(idcol);
    root.appendChild(top);

    if (e.description) root.appendChild(el("p", "card-desc", e.description));

    var foot = el("div", "card-foot");
    if (featured.indexOf(e.id) !== -1) foot.appendChild(el("span", "badge feat", "Featured"));
    var src = sourceOf(e);
    if (src) foot.appendChild(el("span", "badge src", src.kind));
    (e.categories || []).slice(0, 2).forEach(function (c) { foot.appendChild(el("span", "badge", c)); });
    foot.appendChild(copyBtn(installCmd(e.id), "copy-mini", "Copy install"));
    root.appendChild(foot);
    return root;
  }

  /* ── browse ─────────────────────────────────────────────────────────── */
  function matches(e) {
    if (activeCat && (e.categories || []).indexOf(activeCat) === -1) return false;
    if (!query) return true;
    var hay = [e.id, e.name, e.description, e.publisher]
      .concat(e.tags || []).concat(e.categories || [])
      .filter(Boolean).join(" ").toLowerCase();
    return hay.indexOf(query) !== -1;
  }

  function renderBrowse() {
    viewEl.textContent = "";

    if (loadError) {
      viewEl.appendChild(state("err", "✕ Index unreachable", "Could not load the catalogue", [
        "index.json did not load (" + loadError + ").",
        "The catalogue is a plain text file — you can always read it directly in the repository."
      ], [{ label: "index.yaml", href: "./index.yaml" }, { label: "Store on GitHub", href: REPO }]));
      return;
    }
    if (!apps.length) {
      viewEl.appendChild(state("", "Catalogue empty", "Nothing published yet", [
        "The store is live, but it is not yet open to submissions from outside — not for want of tooling, but because accepting them means someone reads every one.",
        "The schema, validation and review process are in place, and entries land here the day their pull request merges."
      ], [
        { label: "Read the policy", href: REPO + "/blob/main/POLICY.md" },
        { label: "Submit an app", href: REPO + "/blob/main/CONTRIBUTING.md", primary: true }
      ]));
      return;
    }

    var wrapEl = el("div", "catalogue");

    /* Rail: only categories some listed app actually uses — a filter that can
       only ever return nothing is worse than no filter. */
    var counts = {};
    apps.forEach(function (a) {
      (a.categories || []).forEach(function (c) { counts[c] = (counts[c] || 0) + 1; });
    });
    var rail = el("aside", "rail");
    rail.appendChild(el("div", "rail-h", "Categories"));
    var railItems = [{ slug: "", label: "All apps", n: apps.length }].concat(
      categories.filter(function (c) { return counts[c.slug]; })
        .map(function (c) { return { slug: c.slug, label: c.label || c.slug, n: counts[c.slug] }; }));
    railItems.forEach(function (c) {
      var b = el("button", "rail-i");
      b.type = "button";
      b.setAttribute("aria-pressed", String(c.slug === activeCat));
      b.appendChild(el("span", null, c.label));
      b.appendChild(el("span", "n", String(c.n)));
      b.addEventListener("click", function () { activeCat = c.slug; renderBrowse(); });
      rail.appendChild(b);
    });
    wrapEl.appendChild(rail);

    var visible = apps.filter(matches).slice().sort(function (a, b) {
      var fa = featured.indexOf(a.id) !== -1, fb = featured.indexOf(b.id) !== -1;
      if (fa !== fb) return fa ? -1 : 1;
      return String(a.id).localeCompare(String(b.id));
    });

    var content = el("div", "content");
    var head = el("div", "content-h");
    var label = activeCat
      ? (categories.filter(function (c) { return c.slug === activeCat; })[0] || {}).label || activeCat
      : "All apps";
    head.appendChild(el("h1", null, query ? "Results" : label));
    head.appendChild(el("span", "count",
      visible.length + (visible.length === 1 ? " app" : " apps") +
      (visible.length !== apps.length ? " of " + apps.length : "")));
    content.appendChild(head);

    var grid = el("div", "grid");
    if (!visible.length) {
      grid.appendChild(state("", "No matches", "Nothing here", [
        "No app matches that filter. Try another category, or clear the search."
      ]));
    } else {
      visible.forEach(function (e) { grid.appendChild(card(e)); });
    }
    content.appendChild(grid);
    wrapEl.appendChild(content);
    viewEl.appendChild(wrapEl);
  }

  /* ── app detail ─────────────────────────────────────────────────────── */
  function renderDetail(id) {
    viewEl.textContent = "";
    var e = byId(id);
    if (!e) {
      viewEl.appendChild(state("err", "✕ Not listed", "No such app", [
        "The catalogue has no entry with the id " + id + ".",
        "It may have been removed, or the link may be out of date."
      ], [{ label: "Back to all apps", href: "#/", primary: true }]));
      return;
    }

    var back = el("a", "back");
    back.href = "#/";
    back.appendChild(el("span", "arrow", "←"));
    back.appendChild(el("span", null, "All apps"));
    viewEl.appendChild(back);

    var d = el("div", "detail");

    var head = el("header", "dt-head");
    head.appendChild(el("span", "glyph lg", glyphOf(e)));
    var hcol = el("div");
    hcol.appendChild(el("h1", null, e.name || e.id));
    hcol.appendChild(el("div", "dt-id", e.id));
    var badges = el("div", "dt-badges");
    if (featured.indexOf(e.id) !== -1) badges.appendChild(el("span", "badge feat", "Featured"));
    (e.categories || []).forEach(function (c) { badges.appendChild(el("span", "badge", c)); });
    (e.tags || []).forEach(function (t) { badges.appendChild(el("span", "badge", "#" + t)); });
    if (badges.childNodes.length) hcol.appendChild(badges);
    head.appendChild(hcol);
    d.appendChild(head);

    if (e.description) d.appendChild(el("p", "dt-desc", e.description));

    /* Install — the one thing a visitor is here to do. */
    var term = el("div", "panel brackets");
    var tbar = el("div", "term-bar");
    tbar.appendChild(el("span", null, "Install"));
    tbar.appendChild(copyBtn(installCmd(e.id), "copy"));
    term.appendChild(tbar);
    var tbody = el("div", "term-body");
    var pre = el("pre");
    pre.appendChild(el("span", "ps1", "$ "));
    pre.appendChild(document.createTextNode(installCmd(e.id)));
    tbody.appendChild(pre);
    term.appendChild(tbody);
    d.appendChild(term);

    var getOs = el("p", "get-os");
    getOs.appendChild(document.createTextNode("That command needs AuraOS. "));
    var g = el("a", null, "Get it, and run this app in a sandbox of its own ↗");
    g.href = "https://aura.lakner.io";
    getOs.appendChild(g);
    d.appendChild(getOs);

    // ── screenshots ──────────────────────────────────────────────────
    // A dead URL is likely: entries point at images on someone else's host
    // and nothing in CI checks they still resolve. So a shot that fails to
    // load removes itself from BOTH the strip and the lightbox's list,
    // rather than leaving a broken-image glyph or a blank slide.
    var shots = (e.screenshots || []).map(safeUrl).filter(Boolean);
    if (shots.length) {
      if (shots.length > 1) {
        d.appendChild(el("div", "shots-count", shots.length + " screenshots"));
      }
      var strip = el("div", "shots");
      var live = [];
      shots.forEach(function (u) {
        var btn = el("button", "shot-btn");
        btn.type = "button";
        btn.setAttribute("aria-label", "View screenshot " + (live.length + 1) + " of " + shots.length);
        var img = el("img");
        img.src = u; img.alt = ""; img.loading = "lazy";
        img.addEventListener("error", function () {
          btn.remove();
          var i = live.indexOf(u);
          if (i >= 0) live.splice(i, 1);
        });
        btn.appendChild(img);
        btn.addEventListener("click", function () { openLightbox(live, live.indexOf(u), e.name || e.id); });
        live.push(u);
        strip.appendChild(btn);
      });
      d.appendChild(strip);
    }

    /* Spec — every fact the entry carries, in one scan. Below the pictures:
       someone deciding whether they want an app looks at it before they read
       which branch it tracks. */
    var spec = el("div", "panel brackets spec");
    var dl = el("dl");
    function row(term_, build) {
      dl.appendChild(el("dt", null, term_));
      var dd = el("dd");
      build(dd);
      dl.appendChild(dd);
    }
    var src = sourceOf(e);
    if (src) {
      row("Source", function (dd) {
        dd.appendChild(el("span", "badge src", src.kind));
        dd.appendChild(el("span", null, src.ref));
      });
      if (src.branch) row("Default branch", function (dd) { dd.textContent = src.branch; });
    }
    var chans = channelsOf(e);
    if (chans.length) {
      row("Channels", function (dd) {
        chans.forEach(function (c) {
          dd.appendChild(el("span", "badge", c.tag ? c.name + " · " + c.tag : c.name));
        });
      });
    }
    if (e.publisher) row("Publisher", function (dd) { dd.textContent = e.publisher; });
    var home = safeUrl(e.homepage);
    if (home) row("Homepage", function (dd) { dd.appendChild(extLink(home, home)); });
    row("App id", function (dd) { dd.textContent = e.id; });
    spec.appendChild(dl);
    d.appendChild(spec);


    var foot = el("p", "note");
    foot.appendChild(document.createTextNode("Listing is not vouching. We reviewed this entry's metadata and confirmed its source resolves — we did not audit the app's code, and its author can push a new tag at any time. "));
    foot.appendChild(extLink(REPO + "/blob/main/POLICY.md", "What review means"));
    d.appendChild(foot);

    viewEl.appendChild(d);
  }

  /* ── connect / publish ──────────────────────────────────────────────── */
  function renderConnect() {
    viewEl.textContent = "";
    var p = el("div", "page");
    var ph = el("div", "page-head");
    ph.appendChild(el("span", "tag", "// Connect"));
    ph.appendChild(el("h1", null, "Add this store to your AuraOS"));
    p.appendChild(ph);
    p.appendChild(el("p", null,
      "One command registers the catalogue. AuraOS fetches the index directly — it never clones this repository."));

    var term = el("div", "panel brackets");
    var tbar = el("div", "term-bar");
    tbar.appendChild(el("span", null, "bash"));
    tbar.appendChild(copyBtn(REGISTRY_CMD, "copy"));
    term.appendChild(tbar);
    var body = el("div", "term-body");
    var pre = el("pre");
    pre.appendChild(el("span", "ps1", "$ "));
    pre.appendChild(document.createTextNode("aura nexus registry add official \\\n    https://nexus.aura.lakner.io/index.yaml \\\n    "));
    pre.appendChild(el("span", "cm", "--kind git-index --priority 10"));
    pre.appendChild(document.createTextNode("\n"));
    pre.appendChild(el("span", "ps1", "$ "));
    pre.appendChild(document.createTextNode("aura nexus search              "));
    pre.appendChild(el("span", "cm", "# then browse it in the Nexus app"));
    body.appendChild(pre);
    term.appendChild(body);
    p.appendChild(term);

    var note = el("p");
    note.appendChild(document.createTextNode("Priority "));
    note.appendChild(el("code", null, "10"));
    note.appendChild(document.createTextNode(" sits behind the built-in "));
    note.appendChild(el("code", null, "local"));
    note.appendChild(document.createTextNode(" registry, so an app you are developing locally still shadows the published one. Don't have AuraOS yet? "));
    var a = el("a", null, "Start here");
    a.href = "https://aura.lakner.io";
    note.appendChild(a);
    note.appendChild(document.createTextNode("."));
    p.appendChild(note);
    viewEl.appendChild(p);
  }

  var LANES = [
    { h: "Runs from source", p: "Push your app to a git repo with app.manifest.json at the root and tag a release. AuraOS installs dependencies on first launch — nothing to build.", c: "sources.git" },
    { h: "Needs a build", p: "Build in your own CI and push the result as an OCI artifact. A reusable GitHub Action in the store repo does build → push for you.", c: "aura nexus app publish --to ghcr.io/<you>/aura-apps/<id>" },
    { h: "Is a service or image", p: "Wrap any existing container image with a thin adapter and runtime: \"raw\". Upstream stays untouched, so upgrades are still docker pull.", c: "sources.oci" }
  ];

  function renderPublish() {
    viewEl.textContent = "";
    var p = el("div", "page");
    var ph = el("div", "page-head");
    ph.appendChild(el("span", "tag", "// Publish"));
    ph.appendChild(el("h1", null, "Get your app listed"));
    p.appendChild(ph);
    p.appendChild(el("p", null,
      "The store never hosts your code — it points at it. Pick the lane that matches what your app needs to run."));

    var lanes = el("div", "lanes");
    LANES.forEach(function (l) {
      var n = el("div", "panel brackets lane");
      n.appendChild(el("h3", null, l.h));
      n.appendChild(el("p", null, l.p));
      var cmd = el("p", "cmd");
      cmd.appendChild(el("code", null, l.c));
      n.appendChild(cmd);
      lanes.appendChild(n);
    });
    p.appendChild(lanes);

    var how = el("p");
    how.appendChild(document.createTextNode("Then add one YAML file to "));
    how.appendChild(el("code", null, "apps/"));
    how.appendChild(document.createTextNode(" and open a pull request. CI validates the schema, checks that your "));
    how.appendChild(el("code", null, "id"));
    how.appendChild(document.createTextNode(" matches your manifest, and confirms every declared channel resolves to a tag that exists. Full guide in "));
    how.appendChild(extLink(REPO + "/blob/main/CONTRIBUTING.md", "CONTRIBUTING.md"));
    how.appendChild(document.createTextNode("."));
    p.appendChild(how);

    var note = el("p", "note");
    note.appendChild(document.createTextNode("Submissions from outside are not open yet. AuraOS does now show you exactly what an app is granted before it installs; what is still missing is review capacity on this side. The reasoning is in "));
    note.appendChild(extLink(REPO + "/blob/main/POLICY.md", "POLICY.md"));
    note.appendChild(document.createTextNode("."));
    p.appendChild(note);
    viewEl.appendChild(p);
  }

  /* ── router ─────────────────────────────────────────────────────────── */
  function currentRoute() {
    var h = (location.hash || "#/").replace(/^#/, "");
    if (h.indexOf("/app/") === 0) return { name: "app", id: decodeURIComponent(h.slice(5)) };
    if (h === "/connect") return { name: "connect" };
    if (h === "/publish") return { name: "publish" };
    return { name: "browse" };
  }

  function route() {
    var r = currentRoute();
    /* Search belongs to the catalogue, so it leaves the toolbar entirely on
       the other pages rather than sitting there inert. */
    var searchable = r.name === "browse";
    searchEl.hidden = !searchable;
    qEl.disabled = !searchable || (!apps.length && !loadError);
    Array.prototype.forEach.call(navEl.children, function (a) {
      var mine = a.getAttribute("data-route");
      if (mine === r.name || (mine === "browse" && r.name === "app")) a.setAttribute("aria-current", "page");
      else a.removeAttribute("aria-current");
    });

    if (r.name === "app") renderDetail(r.id);
    else if (r.name === "connect") renderConnect();
    else if (r.name === "publish") renderPublish();
    else renderBrowse();
  }

  window.addEventListener("hashchange", function () {
    route();
    /* A hash change is a page change: start the new view at the top. */
    if (window.scrollTo) window.scrollTo(0, 0);
  });

  qEl.addEventListener("input", function () {
    query = qEl.value.trim().toLowerCase();
    /* Typing is a request to search the catalogue, wherever you were. */
    if (currentRoute().name !== "browse") { location.hash = "#/"; return; }
    renderBrowse();
  });

  fetch("./index.json", { cache: "no-cache" })
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(function (doc) {
      apps = Array.isArray(doc.apps) ? doc.apps.filter(function (a) { return a && a.id; }) : [];
      featured = Array.isArray(doc.featured) ? doc.featured : [];
      categories = Array.isArray(doc.categories) ? doc.categories : [];
      route();
    })
    .catch(function (err) {
      /* Never leave the loading panel up: a stuck spinner reads as a broken
         page, while a stated failure tells the user where the data actually is. */
      loadError = err.message;
      route();
    });
})();
</script>
</body>
</html>
