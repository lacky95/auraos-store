# On merge to main, regenerate index.yaml and commit it if it changed.
# index.yaml is the artifact every AuraOS instance fetches, so it must always
# reflect apps/ exactly.
name: build-index

on:
  push:
    branches: [main]
    paths: ['apps/**', 'featured.yaml', 'scripts/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Rebuild index.yaml
        run: node scripts/build-index.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- index.yaml; then
            echo "index.yaml already up to date"
            exit 0
          fi
          git config user.name  "auraos-store[bot]"
          git config user.email "auraos-store@users.noreply.github.com"
          git add index.yaml
          git commit -m "chore(index): rebuild from apps/"
          git push
